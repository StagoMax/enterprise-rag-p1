[project]
name = "enterprise-rag-p1"
version = "0.1.0"
description = "Enterprise workflow RAG P1 vertical slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.10,<3",
  "sqlglot>=26,<30",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=5.4.1",
  "torch==2.7.1",
  "transformers>=5.2.0",
]
dev = [
  "playwright>=1.50,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", ".venv", "data/raw", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
