[project]
name = "enterprise-rag-p2"
version = "0.2.0"
description = "Enterprise workflow ACL-first Graph RAG P2 experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pymilvus>=3,<4",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlglot>=26,<30",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
enterprise-sag = "enterprise_sag.cli:main"
enterprise-sag-panel = "enterprise_sag.panel:main"

[project.optional-dependencies]
models = [
  "sentence-transformers>=5.4.1",
  "torch==2.7.1",
  "transformers>=5.2.0",
]
dev = [
  "playwright>=1.50,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
# P1.1 多格式准入：Docling 为主解析器，OOXML/HTML 直读与 pypdf 为降级路径。
# 注意 docling 会拉入自己的 torch/torchvision，安装后需重新固定 [tool.uv.sources]
# 里的 torch==2.7.1+cu128，否则 models extra 的 CUDA 轮子会被 PyPI 版本覆盖。
parsing = [
  "docling>=2.115,<3",
  "fpdf2>=2.8,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
]
# 扫描件 OCR 兜底，按 docs/02 以 PaddleOCR 为主；首次运行需下载识别模型。
parsing-ocr = [
  "paddleocr>=3,<4",
  "pypdfium2>=5,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag", "src/enterprise_sag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", ".venv", "data/raw", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
