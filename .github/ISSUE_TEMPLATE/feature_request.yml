name: Feature request
description: 提议可复用的新能力或架构改进
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景、当前限制和为什么现有能力不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明建议的抽象边界、数据流和兼容性影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些更轻量的做法？
  - type: textarea
    id: evidence
    attributes:
      label: 验收证据
      description: 如何测试、评测或观察该能力已经正确完成？
    validations:
      required: true
